<div class="left">
          <section id="twow-cozy-section">
            <div class="title">
              <h2 data-i18n="section.twow_cozy">2W Cozy</h2>
            </div>
            <div class="card control-card">
              <p id="twow-status" class="setting-status" data-i18n="status.twow_ready">
                Klaar om 2W commando's te sturen
              </p>
              <div id="twow-state" class="twow-state">
                <p>
                  <strong data-i18n="label.twow_last_tx">Laatste TX</strong>:
                  <span id="twow-last-tx">-</span>
                </p>
                <p>
                  <strong data-i18n="label.twow_last_result">Laatste resultaat</strong>
                  : <span id="twow-last-result">-</span>
                </p>
                <p>
                  <strong data-i18n="label.twow_last_rx">Laatste RX</strong>:
                  <span id="twow-last-rx">-</span>
                </p>
                <p>
                  <strong data-i18n="label.twow_last_data">Laatste data</strong>
                  : <span id="twow-last-data">-</span>
                </p>
              </div>
              <div class="twow-grid">
                <button id="twow-poweron" data-i18n="button.twow_poweron">
                  Power on
                </button>
                <button id="twow-midnight" data-i18n="button.twow_midnight">
                  Midnight
                </button>
                <button id="twow-associate" data-i18n="button.twow_associate">
                  Associate
                </button>
                <button id="twow-ack" data-i18n="button.twow_ack">ACK</button>
              </div>
              <div class="control-row">
                <label for="twow-temp" data-i18n="label.twow_temp">
                  Temperatuur
                </label>
                <input id="twow-temp" value="21.0" />
                <button id="twow-settemp" data-i18n="button.twow_settemp">
                  Set temp
                </button>
              </div>
              <div class="control-row">
                <label for="twow-mode" data-i18n="label.twow_mode">Mode</label>
                <select id="twow-mode">
                  <option value="auto">auto</option>
                  <option value="prog">prog</option>
                  <option value="manual">manual</option>
                  <option value="off">off</option>
                </select>
                <button id="twow-setmode" data-i18n="button.twow_setmode">
                  Set mode
                </button>
              </div>
              <div class="control-row">
                <label for="twow-presence" data-i18n="label.twow_presence">Presence</label>
                <select id="twow-presence">
                  <option value="on">on</option>
                  <option value="off">off</option>
                </select>
                <button
                  id="twow-setpresence"
                  data-i18n="button.twow_setpresence"
                >
                  Set presence
                </button>
              </div>
              <div class="control-row">
                <label for="twow-window" data-i18n="label.twow_window">Window</label>
                <select id="twow-window">
                  <option value="open">open</option>
                  <option value="close">close</option>
                </select>
                <button id="twow-setwindow" data-i18n="button.twow_setwindow">
                  Set window
                </button>
              </div>
            </div>
          </section>
        </div>
        <div class="right">
          <section id="twow-other-section">
            <div class="title">
              <h2 data-i18n="section.twow_other">2W Extra</h2>
            </div>
            <div class="card control-card">
              <div class="twow-grid">
                <button id="twow-pair" data-i18n="button.twow_pair">
                  Auto pair 1W / 2W
                </button>
                <button id="twow-pair-alt" data-i18n="button.twow_pair_alt">
                  Pair alt
                </button>
                <button id="twow-pair-key" data-i18n="button.twow_pair_key">
                  2W key pair
                </button>
                <button id="twow-listen" data-i18n="button.twow_listen">
                  Listen 2W
                </button>
                <button id="twow-listen-slow" data-i18n="button.twow_listen_slow">
                  Listen slow
                </button>
                <button id="twow-survey" data-i18n="button.twow_survey">
                  2W survey
                </button>
                <button id="twow-discover28" data-i18n="button.twow_discover28">
                  Discover 28
                </button>
                <button id="twow-discover2a" data-i18n="button.twow_discover2a">
                  Discover 2A
                </button>
                <button id="twow-fake0" data-i18n="button.twow_fake0">
                  Fake0
                </button>
              </div>
              <div class="control-row">
                <label for="twow-custom" data-i18n="label.twow_custom">
                  Custom
                </label>
                <input id="twow-custom" placeholder="01 02 03" />
                <button id="twow-sendcustom" data-i18n="button.twow_sendcustom">
                  Send custom
                </button>
              </div>
              <div class="control-row">
                <label for="twow-custom60" data-i18n="label.twow_custom60">
                    Custom 60
                </label>
                <input id="twow-custom60" placeholder="01 02 03" />
                <button
                  id="twow-sendcustom60"
                  data-i18n="button.twow_sendcustom60"
                >
                  Send custom60
                </button>
              </div>
              <div class="twow-state">
                <p><strong data-i18n="section.twow_survey_results">Survey resultaten</strong></p>
                <table id="twow-survey-table">
                  <thead>
                    <tr>
                      <th data-i18n="table.twow_command">CMD</th>
                      <th data-i18n="table.twow_answer">Antwoord</th>
                    </tr>
                  </thead>
                  <tbody></tbody>
                </table>
              </div>
              <div class="twow-log" id="twow-log"></div>
            </div>
          </section>
        </div>
