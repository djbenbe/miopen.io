name: Build and Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup PlatformIO
        uses: n-vr/setup-platformio-action@v1

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: ${{ runner.os }}-pio-${{ hashFiles('platformio.ini') }}
          restore-keys: ${{ runner.os }}-pio-

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: install esptools
        run: pip install -U esptool

      - name: Generate release tag
        id: generate_release_tag
        uses: alexvingg/next-release-tag@v1.0.4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          tag_prefix: ''

      - name: Build PlatformIO project
        env:
          RELEASE_VERSION: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || steps.generate_release_tag.outputs.release_tag }}
        run: pio run -e LilyGoTBeamV12ESP32 -e LilyGoLoraESP32 -e HeltecLoraV2ESP32 -e LilyGoT3S3

      - name: Build filesystem
        env:
          RELEASE_VERSION: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || steps.generate_release_tag.outputs.release_tag }}
        run: pio run -e LilyGoTBeamV12ESP32 -e LilyGoLoraESP32 -e HeltecLoraV2ESP32 -e LilyGoT3S3 -t buildfs

      - name: Merge bin files together for LilyGoTBeamV12ESP32
        run: esptool --chip esp32 merge-bin -o LilyGoTBeamV12ESP32.bin --flash-size 4MB 0x1000 .pio/build/LilyGoTBeamV12ESP32/bootloader.bin 0x8000 .pio/build/LilyGoTBeamV12ESP32/partitions.bin 0x10000 .pio/build/LilyGoTBeamV12ESP32/firmware.bin 0x3B0000 .pio/build/LilyGoTBeamV12ESP32/littlefs.bin

      - name: Merge bin files together for LilyGoLoraESP32
        run: esptool --chip esp32 merge-bin -o LilyGoLoraESP32.bin --flash-size 4MB 0x1000 .pio/build/LilyGoLoraESP32/bootloader.bin 0x8000 .pio/build/LilyGoLoraESP32/partitions.bin 0x10000 .pio/build/LilyGoLoraESP32/firmware.bin 0x3B0000 .pio/build/LilyGoLoraESP32/littlefs.bin

      - name: Merge bin files together for HeltecLoraV2ESP32
        run: esptool --chip esp32 merge-bin -o HeltecLoraV2ESP32.bin --flash-size 8MB 0x1000 .pio/build/HeltecLoraV2ESP32/bootloader.bin 0x8000 .pio/build/HeltecLoraV2ESP32/partitions.bin 0x10000 .pio/build/HeltecLoraV2ESP32/firmware.bin 0x670000 .pio/build/HeltecLoraV2ESP32/littlefs.bin

      - name: Merge bin files together for LilyGoT3S3
        run: esptool --chip esp32s3 merge-bin -o LilyGoT3S3.bin --flash-size 4MB 0x0 .pio/build/LilyGoT3S3/bootloader.bin 0x8000 .pio/build/LilyGoT3S3/partitions.bin 0x10000 .pio/build/LilyGoT3S3/firmware.bin 0x3B0000 .pio/build/LilyGoT3S3/littlefs.bin

      - name: Prepare firmware and littlefs files for release
        run: |
          mv .pio/build/LilyGoTBeamV12ESP32/firmware.bin LilyGoTBeamV12ESP32_firmware.bin
          mv .pio/build/LilyGoTBeamV12ESP32/littlefs.bin LilyGoTBeamV12ESP32_filesystem.bin
          mv .pio/build/LilyGoLoraESP32/firmware.bin LilyGoLoraESP32_firmware.bin
          mv .pio/build/LilyGoLoraESP32/littlefs.bin LilyGoLoraESP32_filesystem.bin
          mv .pio/build/HeltecLoraV2ESP32/firmware.bin HeltecLoraV2ESP32_firmware.bin
          mv .pio/build/HeltecLoraV2ESP32/littlefs.bin HeltecLoraV2ESP32_filesystem.bin
          mv .pio/build/LilyGoT3S3/firmware.bin LilyGoT3S3_firmware.bin
          mv .pio/build/LilyGoT3S3/littlefs.bin LilyGoT3S3_filesystem.bin

      - name: Generate release notes
        run: |
          cat > changelog.md <<EOF
          Beta release build for ${{ github.ref_name }}.

          Commit: ${{ github.sha }}

          BELANGRIJK VOOR DEZE UPDATE
          - Maak VOORAF zowel een volledige backup als de aparte 2W-backup.
          - De eerste installatie van deze versie op LilyGo T-Beam, LilyGo LoRa en LilyGo T3S3 kan ALLEEN via USB met het gecombineerde boardbestand.
          - Gebruik voor deze eerste migratie NIET de firmware-upload in de webinterface.

          Bugfix: firmware-upload via de webinterface meldt niet langer ten onrechte dat een mislukte upload geslaagd is.

          IMPORTANT UPGRADE NOTICE
          - Make both a full backup and the separate 2W backup before upgrading.
          - LilyGo T-Beam, LilyGo LoRa and LilyGo T3S3 users must install this release once via USB using the combined board image.
          - Do not install the first v2.0.9.2 migration through the web interface. The partition layout changes and the filesystem moves.
          - After the USB migration and backup restore, later firmware updates can be installed through the web interface.
          - Heltec LoRa V2 already uses a dual-OTA partition layout and does not require this partition migration.

          Included files:
          - LilyGoTBeamV12ESP32 combined firmware image
          - LilyGoTBeamV12ESP32 firmware and filesystem images
          - LilyGoLoraESP32 combined firmware image
          - LilyGoLoraESP32 firmware and filesystem images
          - HeltecLoraV2ESP32 combined firmware image
          - HeltecLoraV2ESP32 firmware and filesystem images
          - LilyGoT3S3 combined firmware image
          - LilyGoT3S3 firmware and filesystem images
          EOF

      - name: Release
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || steps.generate_release_tag.outputs.release_tag }}
          body_path: changelog.md
          prerelease: ${{ contains(github.ref_name, '-beta') || !startsWith(github.ref_name, 'v') }}
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || steps.generate_release_tag.outputs.release_tag }}
          files: |
            LilyGoTBeamV12ESP32.bin
            LilyGoTBeamV12ESP32_firmware.bin
            LilyGoTBeamV12ESP32_filesystem.bin
            LilyGoLoraESP32.bin
            LilyGoLoraESP32_firmware.bin
            LilyGoLoraESP32_filesystem.bin
            HeltecLoraV2ESP32.bin
            HeltecLoraV2ESP32_firmware.bin
            HeltecLoraV2ESP32_filesystem.bin
            LilyGoT3S3.bin
            LilyGoT3S3_firmware.bin
            LilyGoT3S3_filesystem.bin

      - name: Upload artifacts
        uses: actions/upload-artifact@v6
        with:
          name: build-artifacts
          path: |
            LilyGoTBeamV12ESP32.bin
            LilyGoTBeamV12ESP32_firmware.bin
            LilyGoTBeamV12ESP32_filesystem.bin
            LilyGoLoraESP32.bin
            LilyGoLoraESP32_firmware.bin
            LilyGoLoraESP32_filesystem.bin
            HeltecLoraV2ESP32.bin
            HeltecLoraV2ESP32_firmware.bin
            HeltecLoraV2ESP32_filesystem.bin
            LilyGoT3S3.bin
            LilyGoT3S3_firmware.bin
            LilyGoT3S3_filesystem.bin
            changelog.md
